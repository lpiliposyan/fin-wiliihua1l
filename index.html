<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Финансы">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f3ef">
<meta name="robots" content="noindex, nofollow">
<style>
:root { color-scheme: light dark; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; min-height: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<title>Мои финансы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column phone app. Sticky header, scrolling cards, fixed bottom tab bar, bottom sheets for forms. */
:root {
  --bg: #f1f3ef;
  --card: #ffffff;
  --fg: #16211f;
  --muted: #667570;
  --line: #e0e5e0;
  --accent: #0e6a62;
  --accent-fg: #ffffff;
  --accent-soft: #dcefeb;
  --in: #1d8a4d;
  --out: #c6443a;
  --warn: #b7791f;
  --warn-soft: #f6ead2;
  --out-soft: #f7dedb;
  --in-soft: #d9efe2;
  --font: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1614; --card: #18221f; --fg: #e8efec; --muted: #8fa19b; --line: #2a3733;
    --accent: #4fc3b5; --accent-fg: #07201c; --accent-soft: #1b3531;
    --in: #55c887; --out: #f07a6e; --warn: #e3b05b; --warn-soft: #3a2f17;
    --out-soft: #3b211e; --in-soft: #17342a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1614; --card: #18221f; --fg: #e8efec; --muted: #8fa19b; --line: #2a3733;
  --accent: #4fc3b5; --accent-fg: #07201c; --accent-soft: #1b3531;
  --in: #55c887; --out: #f07a6e; --warn: #e3b05b; --warn-soft: #3a2f17;
  --out-soft: #3b211e; --in-soft: #17342a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.4; padding-inline: 16px; padding-block: 0 96px; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.app { max-width: 560px; margin: 0 auto; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 8px; padding-block: 12px 8px; }
header.top h1 { font-size: 22px; margin: 0; flex: 1; letter-spacing: -0.01em; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 18px; }
.addbtn { height: 40px; padding-inline: 14px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 600; }

main#view { display: flex; flex-direction: column; gap: 12px; padding-block: 4px 16px; }
.card { background: var(--card); border-radius: 18px; padding: 16px; border: 1px solid var(--line); min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.big { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.mid { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
.in { color: var(--in); } .out { color: var(--out); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 > * { min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.monthbar { display: flex; align-items: center; justify-content: space-between; }
.monthbar b { font-size: 16px; text-transform: capitalize; }
.monthbar button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 18px; }

.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.over > i { background: var(--out); }
.bar.in > i { background: var(--in); }

.pill { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--out-soft); color: var(--out); }
.pill.good { background: var(--in-soft); color: var(--in); }

.cat { display: flex; flex-direction: column; gap: 5px; padding-block: 8px; }
.cat + .cat { border-top: 1px solid var(--line); }

.day { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 12px 4px 6px; display: flex; justify-content: space-between; }
.tx { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; width: 100%; text-align: left; margin-bottom: 6px; }
.tx .dot { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-weight: 700; flex: none; background: var(--accent-soft); color: var(--accent); }
.tx.income .dot { background: var(--in-soft); color: var(--in); }
.tx.expense .dot { background: var(--out-soft); color: var(--out); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 7px 14px; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
input.search { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding-inline: 14px; font-size: 16px; }

.btn { height: 46px; border-radius: 13px; border: 1px solid var(--line); background: var(--card); padding-inline: 16px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--out); }
.btn.block { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns > * { flex: 1; min-width: 120px; }

.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-size: 17px; margin-bottom: 4px; }

.notice { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.insight { padding-block: 6px; font-size: 14px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 6; }
nav.tabs .in { display: flex; width: 100%; max-width: 560px; }
nav.tabs button { flex: 1; border: 0; background: none; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); font-weight: 500; }
nav.tabs button .ic { font-size: 20px; line-height: 1; }
nav.tabs button.on { color: var(--accent); font-weight: 650; }

.overlay { position: fixed; inset: 0; background: rgba(8, 14, 12, 0.5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet h3 { margin: 0; font-size: 19px; flex: 1; }
.sheet form { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 500; }
label.f input, label.f select, label.f textarea { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding-inline: 12px; font-size: 16px; color: var(--fg); width: 100%; min-width: 0; }
label.f textarea { height: 120px; padding: 10px 12px; }
.seg { display: flex; background: var(--line); padding: 3px; border-radius: 12px; gap: 3px; }
.seg button { flex: 1; height: 38px; border: 0; background: none; border-radius: 10px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.amount { font-size: 28px !important; height: 58px !important; font-weight: 650; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 30; font-size: 14px; max-width: 90%; }
.listrow { display: flex; align-items: center; gap: 10px; padding-block: 10px; border-top: 1px solid var(--line); }
.listrow:first-child { border-top: 0; }
svg text { fill: var(--muted); font-family: var(--font); font-size: 9px; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lockscreen { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
.dots { display: flex; gap: 14px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); }
.dots i.on { background: var(--accent); }
.keys { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; }
.keys button { height: 76px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 26px; font-weight: 500; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .4s ease; } }
</style>

<div class="app">
  <header class="top">
    <h1 id="title">Мои финансы</h1>
    <button class="iconbtn" data-act="settings" aria-label="Настройки">⚙</button>
    <button class="addbtn" data-act="addtx">+ Добавить</button>
  </header>
  <div id="warn"></div>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>

<script>
(function () {
  'use strict';

  const DEFAULT_CATS = ['Продукты', 'Кафе и рестораны', 'Транспорт', 'Жильё', 'Коммуналка', 'Связь', 'Подписки', 'Здоровье', 'Одежда', 'Развлечения', 'Подарки', 'Путешествия', 'Прочее'];
  const INCOME_CATS = ['Зарплата', 'Подработка', 'Возврат налога', 'Прочее'];
  const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

  const defaultCfg = () => ({
    cur: '֏',
    accounts: [
      { id: 'a1', name: 'Основной счёт', kind: 'checking', opening: 0, goal: 0 },
      { id: 'a2', name: 'Накопительный X', kind: 'savings', opening: 0, goal: 0 },
      { id: 'a3', name: 'Накопительный Y', kind: 'savings', opening: 0, goal: 0 }
    ],
    budgets: {},
    tax: { cap: 750000, months: [1, 4, 7, 10] },
    recurring: [], plans: [], budget: 0
  });

  const MTG_RATE = 12.75;
  const S = { extra: { monthly: 0, lump: 0 }, tx: [], cfg: defaultCfg(), tab: 'home', month: '', filter: 'all', q: '', myear: String(new Date().getFullYear()), mstat: 'unpaid', tyear: String(new Date().getFullYear()), db: null, ready: false };

  /* ---------- helpers ---------- */
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => iso(new Date());
  const parseD = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const daysInMonth = (ym) => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
  const addPeriod = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
  const dueDate = (ym, day) => ym + '-' + pad(Math.min(Math.max(1, day || 1), daysInMonth(ym)));
  const addMonthsISO = (s, n) => { const d = parseD(s); const day = d.getDate(); const ym = addPeriod(s.slice(0, 7), n); return dueDate(ym, day); };
  const diffDays = (a, b) => Math.round((parseD(a) - parseD(b)) / 86400000);
  const fmtDate = (s) => { const d = parseD(s); return d.getDate() + ' ' + MONTHS_GEN[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
  const monthName = (ym) => MONTHS[Number(ym.slice(5)) - 1] + ' ' + ym.slice(0, 4);
  const cur = () => S.cfg.cur || '$';
  const money = (n, d) => {
    const dec = d == null ? (cur() === '֏' ? 0 : 2) : d;
    return (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('ru-RU', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + ' ' + cur();
  };
  const num = (v) => { const n = parseFloat(String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
  const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const daysText = (n) => n === 0 ? 'сегодня' : n === 1 ? 'завтра' : n > 1 ? 'через ' + n + ' дн.' : 'просрочено на ' + (-n) + ' дн.';
  const acctName = (id) => { const a = S.cfg.accounts.find((x) => x.id === id); return a ? a.name : '—'; };
  const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
  const eff = (t) => t.half ? t.amount / 2 : t.amount;
  const monthsUntil = (d) => Math.max(1, (Number(d.slice(0, 4)) * 12 + Number(d.slice(5, 7))) - (new Date().getFullYear() * 12 + new Date().getMonth() + 1));
  const tagsOf = (t) => (t.tags || '').split(/[,#\s]+/).filter(Boolean).map((x) => x.toLowerCase());
  const getTheme = () => { try { return localStorage.getItem('fin_theme') || 'auto'; } catch (e) { return 'auto'; } };
  function applyTheme() { const v = getTheme(); if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v); }
  function setTheme(v) { try { localStorage.setItem('fin_theme', v); } catch (e) {} applyTheme(); }
  const allCats = () => {
    const set = new Set(DEFAULT_CATS);
    S.tx.forEach((t) => { if (t.cat && t.type === 'expense') set.add(t.cat); });
    return [...set];
  };

  let toastT;
  function toast(msg) {
    const old = $('.toast'); if (old) old.remove();
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el);
    clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2600);
  }

  /* ---------- storage: shared db when available, localStorage otherwise ---------- */
  const LS = 'fin_v1';
  function lsLoad() { try { const d = JSON.parse(localStorage.getItem(LS) || 'null'); if (d) { S.tx = d.tx || []; S.cfg = Object.assign(defaultCfg(), d.cfg || {}); } } catch (e) {} }
  function lsSave() { try { localStorage.setItem(LS, JSON.stringify({ tx: S.tx, cfg: S.cfg })); } catch (e) {} }

  let q = Promise.resolve();
  const enqueue = (fn) => { q = q.then(fn).catch((e) => { toast('Не удалось сохранить: ' + (e && e.message || e)); }); return q; };

  function saveTx(t) {
    const i = S.tx.findIndex((x) => x.id === t.id);
    if (i >= 0) S.tx[i] = t; else S.tx.push(t);
    render();
    if (S.db) return enqueue(() => S.db.doc('tx/' + t.id).set(t));
    lsSave();
  }
  function delTx(id) {
    S.tx = S.tx.filter((x) => x.id !== id);
    render();
    if (S.db) return enqueue(() => S.db.doc('tx/' + id).delete());
    lsSave();
  }
  function saveCfg() {
    render();
    if (S.db) { const snap = JSON.parse(JSON.stringify(S.cfg)); return enqueue(() => S.db.doc('cfg/main').set(snap)); }
    lsSave();
  }

  async function boot() {
    S.month = today().slice(0, 7);
    render();
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (db) {
      S.db = db;
      let first = true;
      db.collection('tx').onSnapshot((snap) => {
        S.tx = snap.docs.map((d) => Object.assign({}, d.data(), { id: d.id }));
        S.ready = true; render();
      }, () => { S.db = null; lsLoad(); render(); });
      db.doc('cfg/main').onSnapshot((snap) => {
        if (snap.exists) S.cfg = Object.assign(defaultCfg(), snap.data());
        if (first) { first = false; }
        render();
      }, () => {});
    } else {
      lsLoad(); S.ready = true;
      $('#warn').innerHTML = '<div class="notice">Данные хранятся только в этом браузере на телефоне. Если очистишь историю сайтов, они пропадут.</div>';
      render();
    }
  }

  /* ---------- computed ---------- */
  const monthTx = (ym) => S.tx.filter((t) => t.date && t.date.slice(0, 7) === ym);
  function totals(list) {
    const inc = sum(list.filter((t) => t.type === 'income' && t.kind !== 'settle'), (t) => t.amount);
    const exp = sum(list.filter((t) => t.type === 'expense' && t.kind !== 'settle'), eff);
    return { inc, exp, net: inc - exp };
  }
  function byCat(list) {
    const m = {};
    list.filter((t) => t.type === 'expense' && t.kind !== 'settle').forEach((t) => { const c = t.cat || 'Без категории'; m[c] = (m[c] || 0) + eff(t); });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  }
  function balance(a) {
    let b = Number(a.opening) || 0;
    S.tx.forEach((t) => {
      if (t.type === 'income' && t.acct === a.id) b += t.amount;
      else if (t.type === 'expense' && t.acct === a.id) b -= t.amount;
      else if (t.type === 'transfer') { if (t.acct === a.id) b -= t.amount; if (t.to === a.id) b += t.amount; }
    });
    return b;
  }
  function monthDelta(a, ym) {
    let b = 0;
    monthTx(ym).forEach((t) => {
      if (t.type === 'income' && t.acct === a.id) b += t.amount;
      else if (t.type === 'expense' && t.acct === a.id) b -= t.amount;
      else if (t.type === 'transfer') { if (t.acct === a.id) b -= t.amount; if (t.to === a.id) b += t.amount; }
    });
    return b;
  }

  /* tax refund: interest paid since the previous refund month, capped */
  function taxRefunds() {
    const cap = S.cfg.tax.cap || 750000;
    const months = (S.cfg.tax.months && S.cfg.tax.months.length ? S.cfg.tax.months : [1, 4, 7, 10]);
    const byYm = {}; PAY.forEach((p) => { const k = p[0].slice(0, 7); byYm[k] = (byYm[k] || 0) + p[2]; });
    const first = PAY[0][0].slice(0, 7), last = PAY[PAY.length - 1][0].slice(0, 7);
    const out = []; let start = first;
    for (let ym = addPeriod(first, 1); ym <= addPeriod(last, 4); ym = addPeriod(ym, 1)) {
      if (!months.includes(Number(ym.slice(5)))) continue;
      let interest = 0;
      for (let k = start; k < ym; k = addPeriod(k, 1)) interest += byYm[k] || 0;
      const from = start; start = ym;
      if (interest <= 0) continue;
      out.push({ key: ym, from, to: addPeriod(ym, -1), interest, amount: Math.min(cap, interest), capped: interest > cap, date: ym + '-01' });
    }
    return out;

    (S.cfg.recurring || []).forEach((r) => {

    const up = [];
    const ms = mtgState();
    if (ms.next >= 0) { const p = PAY[ms.next]; up.push(`<button class="listrow" style="background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left" data-tab="mtg"><div class="grow"><b>Ипотека №${ms.next + 1}</b><div class="small muted">${fmtDate(p[0])}</div></div><div style="text-align:right"><div class="num"><b>${money(p[3])}</b></div><span class="pill ${ms.left < 0 ? 'bad' : ms.left <= 5 ? 'warn' : ''}">${daysText(ms.left)}</span></div></button>`); }
    recurringDue().filter((x) => x.left <= 7).forEach((x) => up.push(`<div class="listrow"><div class="grow"><b>${esc(x.r.name)}</b><div class="small muted">${fmtDate(x.due)}</div></div><div style="text-align:right"><div class="num"><b>${money(x.r.amount)}</b></div><span class="pill ${x.left < 0 ? 'bad' : 'warn'}">${daysText(x.left)}</span></div><button class="chip" data-act="payrec" data-id="${x.r.id}">Оплачено</button></div>`));
    const rm0 = recvMap(); const nr = taxRefunds().find((r) => !rm0[r.key]);
    if (nr) up.push(`<button class="listrow" style="background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left" data-tab="tax"><div class="grow"><b>Возврат налога</b><div class="small muted">${monthName(nr.key)}</div></div><div style="text-align:right"><div class="num in"><b>+${money(nr.amount)}</b></div></div></button>`);
    if (up.length) h += `<div class="card"><h2>Скоро</h2>${up.join('')}</div>`;
    if (isNow) h += forecastCard();

    // categories
    if (cats.length) {
      h += `<div class="card"><h2>Куда уходят деньги</h2>` + cats.map(([c, v]) => {
        const lim = Number(S.cfg.budgets[c]) || 0;
        const pct = lim > 0 ? Math.min(100, v / lim * 100) : (tt.exp ? v / tt.exp * 100 : 0);
        return `<button class="cat" data-cat="${esc(c)}" style="background:none;border:0;width:100%;text-align:left;padding-inline:0"><div class="row between"><span class="trunc">${esc(c)}</span><span class="num"><b>${money(v, 0)}</b>${lim > 0 ? `<span class="muted small"> из ${money(lim, 0)}</span>` : ''}</span></div><div class="bar ${lim > 0 && v > lim ? 'over' : ''}"><i style="width:${pct}%"></i></div></button>`;
      }).join('') + `<div class="small muted" style="margin-top:6px">Нажми на категорию, чтобы увидеть все операции. Лимиты задаются в ⚙</div></div>`;

      h += `<div class="card"><h2>По дням</h2>${dayChart(list)}</div>`;
      h += `<div class="card"><h2>Последние 6 месяцев</h2>${monthChart()}</div>`;
      const tg = tagStats(list);
      if (tg.length) h += `<div class="card"><h2>Теги</h2><div class="chips" style="flex-wrap:wrap">${tg.map(([g, v]) => `<button class="chip" data-tag="${esc(g)}">#${esc(g)} ${money(v, 0)}</button>`).join('')}</div></div>`;

      // insights
      const ins = [];
      if (isNow) {
        const dnum = new Date().getDate();
        const dim = daysInMonth(S.month);
        ins.push(`В среднем ${money(tt.exp / dnum, 0)} в день. К концу месяца выйдет около ${money(tt.exp / dnum * dim, 0)}.`);
      }
      cats.forEach(([c, v]) => { const p = prevCats[c]; if (p > 0 && v > p * 1.25 && v - p > 20 && ins.length < 4) ins.push(`<b>${esc(c)}</b>: на ${Math.round((v / p - 1) * 100)}% больше, чем в прошлом месяце (${money(p, 0)}).`); });
      if (ins.length) h += `<div class="card"><h2>Заметки</h2>${ins.map((x) => `<div class="insight">${x}</div>`).join('')}</div>`;
    } else {
      h += `<div class="card empty"><b>В этом месяце пока пусто</b>Нажми «+ Добавить» или загрузи историю из банка в ⚙ → Импорт.</div>`;
    }

    const tot = sum(S.cfg.accounts, balance);
    const sav = sum(S.cfg.accounts.filter((a) => a.kind === 'savings'), balance);
    h += `<div class="card"><h2>Всего на счетах</h2><div class="mid num">${money(tot, 0)}</div><div class="small muted">из них накопления ${money(sav, 0)}</div></div>`;
    h += `<button class="btn block" data-act="report">Итоги месяца и года</button>`;
    return h;
  }

  const short = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(Math.round(n));
  function forecast() {
    const ym = today().slice(0, 7), end = dueDate(ym, 31), now = new Date();
    const dim = daysInMonth(ym), dn = now.getDate(), daysLeft = dim - dn;
    const bal = sum(S.cfg.accounts.filter((a) => a.kind !== 'savings'), balance);
    const items = [], pm = paidMap(), rm = recvMap();
    PAY.forEach((p, i) => { if (!pm[i] && p[0] >= today() && p[0] <= end) items.push({ name: 'Ипотека', amount: -p[3], date: p[0] }); });
    recurringDue().forEach((x) => { if (x.due >= today() && x.due <= end) items.push({ name: x.r.name, amount: -x.r.amount, date: x.due }); });
    items.sort((a, b) => a.date.localeCompare(b.date));
    const base = bal + sum(items, (x) => x.amount);
    const spent = sum(monthTx(ym).filter((t) => t.type === 'expense' && t.kind !== 'settle' && t.kind !== 'mortgage' && !t.rid), eff);
    const pace = dn >= 3 ? spent / dn : 0;
    const refund = taxRefunds().find((r) => r.key === ym && !rm[r.key]);
    return { bal, items, base, pace, daysLeft, withPace: base - pace * daysLeft, refund };
  }
  function forecastCard() {
    const f = forecast();
    const rows = f.items.map((x) => `<div class="row between small"><span class="muted">${fmtDate(x.date)} · ${esc(x.name)}</span><span class="num out">${money(x.amount, 0)}</span></div>`).join('');
    return `<div class="card"><h2>Прогноз на конец месяца</h2>
      <div class="row between small"><span class="muted">Сейчас на текущих счетах</span><span class="num">${money(f.bal, 0)}</span></div>
      ${rows || '<div class="small muted">Обязательных платежей до конца месяца нет.</div>'}
      <div class="row between" style="margin-top:10px"><b>После платежей</b><span class="mid num ${f.base < 0 ? 'out' : ''}">${money(f.base, 0)}</span></div>
      ${f.pace > 0 ? `<div class="row between small" style="margin-top:6px"><span class="muted">С обычными тратами (около ${money(f.pace, 0)} в день, ещё ${f.daysLeft} дн.)</span><b class="num ${f.withPace < 0 ? 'out' : ''}">${money(f.withPace, 0)}</b></div>` : ''}
      ${f.refund ? `<div class="small in" style="margin-top:8px">Плюс возврат налога около ${money(f.refund.amount, 0)}, если придёт в этом месяце.</div>` : ''}
      ${f.withPace < 0 || f.base < 0 ? '<div class="notice" style="margin-top:10px">Денег на текущих счетах может не хватить. Проверь, нужен ли перевод с накопительного.</div>' : ''}
      </div>`;
  }

  function monthChart() {
    const ms = []; for (let k = 5; k >= 0; k--) ms.push(addPeriod(S.month, -k));
    const data = ms.map((ym) => totals(monthTx(ym)));
    const max = Math.max(...data.map((d) => Math.max(d.inc, d.exp)), 1);
    const W = 300, H = 100, gw = W / 6;
    let g = `<svg viewBox="0 0 ${W} ${H + 18}" width="100%" role="img" aria-label="Доходы и расходы по месяцам"><line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>`;
    data.forEach((d, i) => {
      const x = i * gw + gw / 2, hi = d.inc / max * (H - 16), he = d.exp / max * (H - 16);
      g += `<rect x="${x - 13}" y="${H - hi}" width="12" height="${hi}" rx="2" fill="var(--in)"/><rect x="${x + 1}" y="${H - he}" width="12" height="${he}" rx="2" fill="var(--out)"/>`;
      g += `<text x="${x}" y="${H + 12}" text-anchor="middle">${MONTHS[Number(ms[i].slice(5)) - 1].slice(0, 3)}</text>`;
      if (d.exp > 0) g += `<text x="${x + 7}" y="${H - he - 3}" text-anchor="middle">${short(d.exp)}</text>`;
    });
    return g + `</svg><div class="small muted"><span class="in">■</span> доходы · <span class="out">■</span> расходы</div>`;
  }

  function catSheet(c) {
    const list = monthTx(S.month).filter((t) => t.type === 'expense' && t.kind !== 'settle' && (t.cat || 'Без категории') === c).sort((a, b) => b.date.localeCompare(a.date) || b.amount - a.amount);
    sheet(c, `<div class="muted small">${monthName(S.month)} · операций: ${list.length} · <b class="num">${money(sum(list, eff))}</b></div>` + list.map((t) => `<button type="button" class="tx expense" data-edit="${t.id}"><div class="grow"><div class="trunc"><b>${esc(t.note || t.cat)}</b></div><div class="small muted">${fmtDate(t.date)} · ${esc(acctName(t.acct))}</div></div><div class="num out"><b>−${money(eff(t))}</b>${t.half ? '<div class="small muted">половина</div>' : ''}</div></button>`).join(''));
  }

  function tagStats(list) {
    const m = {};
    list.filter((t) => t.type === 'expense' && t.kind !== 'settle').forEach((t) => tagsOf(t).forEach((g) => { m[g] = (m[g] || 0) + eff(t); }));
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  }
  function tagSheet(tag) {
    const list = monthTx(S.month).filter((t) => t.type === 'expense' && tagsOf(t).includes(tag)).sort((a, b) => b.date.localeCompare(a.date));
    sheet('#' + tag, `<div class="muted small">${monthName(S.month)} · <b class="num">${money(sum(list, eff))}</b></div>` + list.map((t) => `<button type="button" class="tx expense" data-edit="${t.id}"><div class="grow"><div class="trunc"><b>${esc(t.note || t.cat)}</b></div><div class="small muted">${fmtDate(t.date)} · ${esc(t.cat || '')}</div></div><div class="num out"><b>−${money(eff(t))}</b></div></button>`).join(''));
  }

  function debts() {
    const m = {};
    S.tx.forEach((t) => {
      if (!t.partner) return;
      if (t.kind === 'settle') m[t.partner] = (m[t.partner] || 0) + (t.type === 'income' ? -t.amount : t.amount);
      else if (t.half && t.type === 'expense') m[t.partner] = (m[t.partner] || 0) + t.amount / 2;
    });
    return m;
  }
  function settleSheet() {
    const names = Object.keys(debts());
    sheet('Взаиморасчёт', `${field('С кем', `<input name="who" list="wl" value="${esc(names[0] || '')}" required><datalist id="wl">${names.map((n) => `<option value="${esc(n)}">`).join('')}</datalist>`)}
      ${field('Что произошло', `<select name="dir"><option value="in">Мне вернули деньги</option><option value="out">Я вернула деньги</option></select>`)}
      ${field('Сумма', `<input class="amount num" name="amount" inputmode="decimal" required>`)}
      <div class="grid2">${field('Дата', `<input type="date" name="date" value="${today()}" required>`)}${field('Счёт', `<select name="acct">${acctOptions()}</select>`)}</div>`, (f) => {
      const amount = num(f.amount.value);
      if (!(amount > 0) || !f.who.value.trim()) { toast('Нужны имя и сумма'); return false; }
      saveTx({ id: uid(), type: f.dir.value === 'in' ? 'income' : 'expense', kind: 'settle', partner: f.who.value.trim(), cat: 'Взаиморасчёт', note: 'Взаиморасчёт: ' + f.who.value.trim(), amount, date: f.date.value, acct: f.acct.value, ts: Date.now() });
      toast('Записано');
    });
  }

  let lastReport = '';
  function reportSheet(mode) {
    mode = mode || 'month';
    const ym = S.month, yr = ym.slice(0, 4);
    const sel = (key, y, p) => (t) => t.date && t.kind !== 'settle' && (mode === 'month' ? t.date.slice(0, 7) === p : t.date.slice(0, 4) === y);
    const list = S.tx.filter(sel('', yr, ym)), prev = S.tx.filter(sel('', String(Number(yr) - 1), addPeriod(ym, -1)));
    const tt = totals(list), pt = totals(prev);
    const cats = byCat(list).slice(0, 5);
    const big = list.filter((t) => t.type === 'expense').sort((a, b) => eff(b) - eff(a))[0];
    const title = mode === 'month' ? monthName(ym) : yr + ' год';
    const lines = ['Итоги: ' + title, 'Доходы: ' + money(tt.inc, 0), 'Расходы: ' + money(tt.exp, 0) + (pt.exp > 0 ? ' (' + (tt.exp >= pt.exp ? '+' : '') + Math.round((tt.exp / pt.exp - 1) * 100) + '% к прошлому периоду)' : ''), 'Осталось: ' + money(tt.net, 0) + (tt.inc > 0 ? ' (' + Math.round(tt.net / tt.inc * 100) + '% дохода)' : '')];
    if (cats.length) { lines.push('Больше всего ушло на:'); cats.forEach(([c, v]) => lines.push('  ' + c + ': ' + money(v, 0) + (tt.exp ? ' (' + Math.round(v / tt.exp * 100) + '%)' : ''))); }
    if (big) lines.push('Самая большая трата: ' + (big.note || big.cat) + ', ' + money(eff(big), 0) + ', ' + fmtDate(big.date));
    lines.push('Операций: ' + list.length);
    lastReport = lines.join('\n');
    sheet('Итоги', `<div class="seg"><button type="button" class="${mode === 'month' ? 'on' : ''}" data-rep="month">Месяц</button><button type="button" class="${mode === 'year' ? 'on' : ''}" data-rep="year">Год</button></div>
      <div class="card" style="white-space:pre-wrap">${esc(lastReport)}</div><button type="button" class="btn" data-act="copyrep">Скопировать текст</button>`);
  }

  function planForm(p) {
    const editing = !!p;
    p = p || { id: 'p' + Date.now().toString(36), name: '', amount: 0, date: '', saved: 0 };
    sheet(editing ? 'Цель' : 'Новая цель', `${field('Что планируешь', `<input name="name" value="${esc(p.name)}" placeholder="Отпуск, ремонт, техника" required autofocus>`)}
      ${field('Сколько нужно', `<input name="amount" inputmode="decimal" value="${p.amount || ''}" required>`)}
      ${field('Уже отложено', `<input name="saved" inputmode="decimal" value="${p.saved || ''}" placeholder="0">`)}
      ${field('К какой дате', `<input type="date" name="date" value="${p.date || ''}">`)}
      ${editing ? '<button type="button" class="btn danger" id="delplan">Удалить цель</button>' : ''}`, (f) => {
      const o = { id: p.id, name: f.name.value.trim(), amount: num(f.amount.value), saved: num(f.saved.value), date: f.date.value };
      const list = (S.cfg.plans || []).filter((x) => x.id !== p.id); list.push(o); S.cfg.plans = list; saveCfg();
    });
    const d = $('#delplan'); if (d) d.addEventListener('click', () => { S.cfg.plans = S.cfg.plans.filter((x) => x.id !== p.id); saveCfg(); closeSheet(); });
  }

  function dayChart(list) {
    const dim = daysInMonth(S.month);
    const vals = Array(dim).fill(0);
    list.filter((t) => t.type === 'expense' && t.kind !== 'settle').forEach((t) => { vals[Number(t.date.slice(8)) - 1] += eff(t); });
    const max = Math.max(...vals, 1);
    const W = 300, H = 90, L = 4, B = 14, bw = (W - L) / dim;
    let s = `<svg viewBox="0 0 ${W} ${H + B}" width="100%" role="img" aria-label="Расходы по дням"><line x1="${L}" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>`;
    vals.forEach((v, i) => { const h = v / max * (H - 12); if (v > 0) s += `<rect x="${(L + i * bw + 0.8).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${Math.max(1, bw - 1.6).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="var(--accent)"/>`; });
    s += `<text x="${L}" y="${H + 11}">1</text><text x="${W / 2}" y="${H + 11}" text-anchor="middle">${Math.round(dim / 2)}</text><text x="${W}" y="${H + 11}" text-anchor="end">${dim}</text>`;
    s += `<text x="${L}" y="8">макс ${Math.round(max)} ${esc(cur())}</text></svg>`;
    return s;
  }

  function vOps() {
    let list = monthTx(S.month);
    if (S.filter !== 'all') list = list.filter((t) => t.type === S.filter);
    const qq = S.q.trim().toLowerCase();
    if (qq) list = list.filter((t) => ((t.note || '') + ' ' + (t.cat || '') + ' ' + (t.tags || '') + ' ' + acctName(t.acct)).toLowerCase().includes(qq));
    list.sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
    let h = monthBar();
    h += `<input class="search" id="q" type="search" placeholder="Поиск по заметке или категории" value="${esc(S.q)}">`;
    h += `<div class="chips">${[['all', 'Все'], ['expense', 'Расходы'], ['income', 'Доходы'], ['transfer', 'Переводы']].map((c) => `<button class="chip ${S.filter === c[0] ? 'on' : ''}" data-filter="${c[0]}">${c[1]}</button>`).join('')}</div>`;
    if (!list.length) return h + `<div class="card empty"><b>Нет операций</b>Добавь первую кнопкой «+ Добавить» или импортируй выписку из банка.</div>`;
    const tt = totals(list);
    h += `<div class="small muted" style="padding-inline:4px">Расходы <b class="out num">${money(tt.exp)}</b> · Доходы <b class="in num">${money(tt.inc)}</b></div>`;
    let last = '';
    list.forEach((t) => {
      if (t.date !== last) { last = t.date; const dayList = list.filter((x) => x.date === t.date); const dt = totals(dayList); h += `<div class="day"><span>${fmtDate(t.date)}</span><span class="num">${dt.exp ? '−' + money(dt.exp, 0) : ''}</span></div>`; }
      const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '−' : '';
      const title = t.type === 'transfer' ? `${esc(acctName(t.acct))} → ${esc(acctName(t.to))}` : esc(t.note || t.cat || 'Без названия');
      const sub = t.type === 'transfer' ? 'Перевод' : esc((t.note ? (t.cat || '') + ' · ' : '') + acctName(t.acct)) + (t.half ? ' · пополам с ' + esc(t.partner) : '') + (t.tags ? ' · #' + esc(tagsOf(t).join(' #')) : '');
      h += `<button class="tx ${t.type}" data-edit="${t.id}"><div class="dot">${t.type === 'income' ? '↓' : t.type === 'expense' ? '↑' : '⇄'}</div><div class="grow"><div class="trunc"><b>${title}</b></div><div class="small muted trunc">${sub}</div></div><div class="num ${t.type === 'income' ? 'in' : t.type === 'expense' ? 'out' : ''}"><b>${sign}${money(t.amount)}</b></div></button>`;
    });
    return h;
  }

  const rowBtn = 'style="background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left"';
  function vMtg() {
    const ms = mtgState();
    const lastP = PAY[PAY.length - 1];
    let h = '';
    const overdueIdx = PAY.map((_, i) => i).filter((i) => !ms.pm[i] && PAY[i][0] < today());
    if (ms.next >= 0) {
      const p = PAY[ms.next];
      const st = ms.left < 0 ? 'bad' : ms.left <= 5 ? 'warn' : 'good';
      h += `<div class="card"><div class="row between"><span class="muted small">Следующий платёж · №${ms.next + 1} из ${PAY.length}</span><span class="pill ${st}">${daysText(ms.left)}</span></div>
        <div class="big num">${money(p[3])}</div><div style="margin-top:4px"><b>${fmtDate(p[0])}</b></div>
        <div class="grid2 small" style="margin-top:12px"><div><div class="muted">Основной долг</div><b class="num">${money(p[1])}</b></div><div><div class="muted">Проценты</div><b class="num">${money(p[2])}</b></div></div>
        <div class="btns" style="margin-top:14px"><button class="btn primary" data-sid="${ms.next}">Отметить оплаченным</button><button class="btn" data-act="ics">В календарь</button></div></div>`;
    } else h += `<div class="card empty"><b>Все платежи выполнены</b>Ипотека закрыта.</div>`;
    if (overdueIdx.length > 1 || (overdueIdx.length === 1 && ms.paidCount === 0)) h += `<div class="notice">Платежей с прошедшей датой без отметки: ${overdueIdx.length}. <button class="chip" data-act="markpast" style="margin-top:8px">Отметить все прошедшие оплаченными</button></div>`;
    const pctN = ms.paidCount / PAY.length * 100, pctP = ms.principalPaid / ms.principalAll * 100;
    h += `<div class="card"><h2>Осталось выплатить</h2><div class="big num">${money(ms.tot - ms.paidSum, 0)}</div>
      <div class="bar in" style="margin-top:12px"><i style="width:${pctN}%"></i></div>
      <div class="row between small muted" style="margin-top:6px"><span>Оплачено ${ms.paidCount} из ${PAY.length} платежей</span><span>${pctN.toFixed(1)}%</span></div>
      <div class="grid2" style="margin-top:14px"><div><div class="muted small">Основной долг, остаток</div><div class="mid num">${money(ms.principalAll - ms.principalPaid, 0)}</div></div><div><div class="muted small">Проценты, остаток</div><div class="mid num out">${money(ms.interestLeft, 0)}</div></div></div>
      <div class="small muted" style="margin-top:12px">Всего к выплате ${money(ms.tot, 0)} · последний платёж ${fmtDate(lastP[0])}</div></div>`;
    h += `<div class="card"><h2>Досрочные платежи</h2><div class="small muted" style="margin-bottom:10px">Сколько сэкономишь, если платить больше. Расчёт приблизительный: банк считает проценты по дням.</div><div class="grid2">${field('Добавлять в месяц', `<input id="xm" inputmode="decimal" value="${S.extra.monthly || ''}" placeholder="0">`)}${field('Внести сразу', `<input id="xl" inputmode="decimal" value="${S.extra.lump || ''}" placeholder="0">`)}</div><div id="xres" style="margin-top:12px">${extraResult()}</div></div>`;
    const years = [...new Set(PAY.map((p) => p[0].slice(0, 4)))];
    h += `<div class="row"><select id="myear" class="search" style="flex:1;padding-inline:12px">${years.map((y) => `<option value="${y}" ${S.myear === y ? 'selected' : ''}>${y}</option>`).join('')}<option value="all" ${S.myear === 'all' ? 'selected' : ''}>Все годы</option></select></div>`;
    h += `<div class="chips">${[['unpaid', 'Не оплачено'], ['paid', 'Оплачено'], ['all', 'Все']].map((c) => `<button class="chip ${S.mstat === c[0] ? 'on' : ''}" data-mstat="${c[0]}">${c[1]}</button>`).join('')}</div>`;
    const rows = PAY.map((p, i) => i).filter((i) => (S.myear === 'all' || PAY[i][0].startsWith(S.myear)) && (S.mstat === 'all' || (S.mstat === 'paid') === !!ms.pm[i]));
    h += `<div class="card">` + (rows.length ? rows.map((i) => {
      const p = PAY[i], paid = !!ms.pm[i];
      const d = diffDays(p[0], today());
      const pill = paid ? '<span class="pill good">Оплачено</span>' : d < 0 ? '<span class="pill bad">Просрочено</span>' : d <= 14 ? '<span class="pill warn">Скоро</span>' : '<span class="pill">' + d + ' дн.</span>';
      return `<button class="listrow" ${rowBtn} data-sid="${i}"><div class="grow"><b>${fmtDate(p[0])}</b><div class="small muted num">№${i + 1} · долг ${money(p[1], 0)} · % ${money(p[2], 0)}</div></div><div style="text-align:right"><div class="num"><b>${money(p[3], 0)}</b></div>${pill}</div></button>`;
    }).join('') : `<div class="small muted">Тут пусто.</div>`) + `</div>`;
    return h;
  }

  function simulate(bal, rate, pay, extra, lump) {
    let b = bal - lump, n = 0, interest = 0;
    while (b > 0.5 && n < 700) {
      const i = b * rate / 1200;
      if (pay + extra <= i) return null;
      interest += i; b = b + i - pay - extra; n++;
    }
    return { n, interest };
  }
  function extraResult() {
    const ms = mtgState(); if (ms.next < 0) return '';
    const x = S.extra;
    if (!(x.monthly > 0 || x.lump > 0)) return '<div class="small muted">Введи сумму, и я покажу разницу.</div>';
    const bal = ms.principalAll - ms.principalPaid, pay = PAY[1][3];
    const base = simulate(bal, MTG_RATE, pay, 0, 0), r = simulate(bal, MTG_RATE, pay, x.monthly, x.lump);
    if (!base || !r) return '<div class="small muted">Не получилось посчитать.</div>';
    const earlier = Math.max(0, base.n - r.n);
    const endNew = addPeriod(PAY[PAY.length - 1][0].slice(0, 7), -earlier);
    return `<div class="grid2"><div><div class="muted small">Закроешь раньше на</div><div class="mid num in">${earlier} мес.</div><div class="small muted">${monthName(endNew)} вместо ${monthName(PAY[PAY.length - 1][0].slice(0, 7))}</div></div><div><div class="muted small">Сэкономишь на процентах</div><div class="mid num in">≈ ${money(Math.max(0, base.interest - r.interest), 0)}</div></div></div>`;
  }

  function vTax() {
    const list = taxRefunds(), rm = recvMap();
    const cap = S.cfg.tax.cap || 750000;
    const recv = list.filter((r) => rm[r.key]);
    const gotTotal = sum(recv, (r) => rm[r.key].amount);
    const next = list.find((r) => !rm[r.key]);
    const yr = String(new Date().getFullYear());
    const yearExpected = sum(list.filter((r) => r.key.startsWith(yr)), (r) => r.amount);
    const yearGot = sum(recv.filter((r) => r.key.startsWith(yr)), (r) => rm[r.key].amount);
    let h = '';
    if (next) {
      const left = diffDays(next.date, today());
      h += `<div class="card"><div class="row between"><span class="muted small">Следующий возврат</span><span class="pill good">${left <= 0 ? 'в этом месяце' : 'через ' + left + ' дн.'}</span></div>
        <div class="big num in">+${money(next.amount, 0)}</div><div style="margin-top:4px"><b>${monthName(next.key)}</b></div>
        <div class="small muted" style="margin-top:8px">Проценты за ${monthName(next.from)} – ${monthName(next.to)}: ${money(next.interest, 0)}${next.capped ? '. Больше лимита ' + money(cap, 0) + ', вернут только лимит.' : '. Меньше лимита, вернут всё.'}</div>
        <div class="btns" style="margin-top:14px"><button class="btn primary" data-rkey="${next.key}">Деньги пришли</button><button class="btn" data-act="taxsetup">Правила</button></div></div>`;
    }
    h += `<div class="grid2"><div class="card"><div class="muted small">Получено всего</div><div class="mid num in">${money(gotTotal, 0)}</div></div><div class="card"><div class="muted small">В ${yr} получено</div><div class="mid num in">${money(yearGot, 0)}</div><div class="small muted">из ${money(yearExpected, 0)}</div></div></div>`;
    h += `<div class="card small"><b>Как считается.</b> За каждый период берутся проценты по ипотеке из графика. Если они больше ${money(cap, 0)}, возвращают ${money(cap, 0)}. Если меньше, возвращают столько же, сколько заплачено процентами. Деньги приходят в месяцы: ${(S.cfg.tax.months || []).map((m) => MONTHS[m - 1]).join(', ')}. <button class="chip" data-act="taxsetup">Изменить</button></div>`;
    const years = [...new Set(list.map((r) => r.key.slice(0, 4)))];
    h += `<select id="tyear" class="search" style="padding-inline:12px">${years.map((y) => `<option value="${y}" ${S.tyear === y ? 'selected' : ''}>${y}</option>`).join('')}</select>`;
    const yl = list.filter((r) => r.key.startsWith(S.tyear));
    const yInt = sum(yl, (r) => r.interest), yAmt = sum(yl, (r) => r.amount), yGot = sum(yl.filter((r) => rm[r.key]), (r) => rm[r.key].amount);
    h += `<div class="card"><h2>Итоги ${S.tyear} года</h2><div class="grid2"><div><div class="muted small">Проценты по ипотеке</div><div class="mid num">${money(yInt, 0)}</div></div><div><div class="muted small">Вернут всего</div><div class="mid num in">${money(yAmt, 0)}</div></div></div><div class="small muted" style="margin-top:10px">Получено ${money(yGot, 0)}, ещё ждать ${money(yAmt - yGot, 0)}.${yInt > yAmt ? ' Выше лимита ' + money(yInt - yAmt, 0) + ' процентов не вернётся.' : ''}</div></div>`;
    h += `<div class="card">` + list.filter((r) => r.key.startsWith(S.tyear)).map((r) => {
      const got = rm[r.key];
      return `<button class="listrow" ${rowBtn} data-rkey="${r.key}"><div class="grow"><b style="text-transform:capitalize">${monthName(r.key)}</b><div class="small muted num">проценты ${money(r.interest, 0)}${r.capped ? ' · лимит' : ''}</div></div><div style="text-align:right"><div class="num in"><b>+${money(got ? got.amount : r.amount, 0)}</b></div>${got ? '<span class="pill good">Получено</span>' : r.date < today() ? '<span class="pill warn">Ждём</span>' : '<span class="pill">Впереди</span>'}</div></button>`;
    }).join('') + `</div>`;
    return h;
  }

  function vAcc() {
    const accs = S.cfg.accounts;
    const tot = sum(accs, balance);
    const sav = sum(accs.filter((a) => a.kind === 'savings'), balance);
    let h = `<div class="card"><div class="muted small">Всего</div><div class="big num">${money(tot, 0)}</div><div class="small muted" style="margin-top:4px">накопления ${money(sav, 0)} · текущие ${money(tot - sav, 0)}</div></div>`;
    accs.forEach((a) => {
      const b = balance(a);
      const d = monthDelta(a, today().slice(0, 7));

      h += `<button class="card" style="text-align:left;width:100%" data-acc="${a.id}">
        <div class="row between"><div class="grow"><b>${esc(a.name)}</b> <span class="pill">${a.kind === 'savings' ? 'накопления' : 'текущий'}</span></div></div>
        <div class="mid num" style="margin-top:6px">${money(b)}</div>

        ${goal > 0 ? `<div class="bar in" style="margin-top:10px"><i style="width:${Math.max(0, Math.min(100, b / goal * 100))}%"></i></div><div class="small muted" style="margin-top:4px">Цель ${money(goal, 0)} · ${Math.max(0, Math.round(b / goal * 100))}% · осталось ${money(Math.max(0, goal - b), 0)}</div>${a.goalDate && goal > b ? `<div class="small" style="margin-top:2px">Чтобы успеть к ${fmtDate(a.goalDate)}, откладывай <b class="num">${money((goal - b) / Math.max(1, (Number(a.goalDate.slice(0, 4)) * 12 + Number(a.goalDate.slice(5, 7))) - (new Date().getFullYear() * 12 + new Date().getMonth() + 1)), 0)}</b> в месяц</div>` : ''}` : ''}
      </button>`;
    });
    h += `<div class="btns"><button class="btn primary" data-act="addacc">+ Счёт</button><button class="btn" data-act="transfer">⇄ Перевод между счетами</button></div>`;

    if (cm.length) { const avg = sum(cm, (x) => x) / cm.length; h += `<div class="mid num">${(sav / avg).toFixed(1)} мес.</div><div class="small muted">на накоплениях. На всех счетах ${(tot / avg).toFixed(1)} мес. Средние расходы ${money(avg, 0)} в месяц (по прошлым ${cm.length} мес.).</div>`; }
    else h += `<div class="small muted">Появится, когда будут расходы за прошлые месяцы.</div>`;
    h += `</div>`;
    const plans = S.cfg.plans || [];
    h += `<div class="card"><h2>Планы на крупные траты</h2>` + (plans.length ? plans.map((p) => {
      const pct = p.amount ? Math.max(0, Math.min(100, p.saved / p.amount * 100)) : 0;
      return `<button class="cat" data-plan="${p.id}" style="background:none;border:0;width:100%;text-align:left;padding-inline:0"><div class="row between"><b class="trunc">${esc(p.name)}</b><span class="num small">${money(p.saved, 0)} из ${money(p.amount, 0)}</span></div><div class="bar in"><i style="width:${pct}%"></i></div>${p.date && p.amount > p.saved ? `<div class="small muted">К ${fmtDate(p.date)}: откладывай ${money((p.amount - p.saved) / monthsUntil(p.date), 0)} в месяц</div>` : ''}</button>`;
    }).join('') : '<div class="small muted">Отпуск, ремонт, техника: укажи сумму и дату.</div>') + `<button class="chip" data-act="addplan" style="margin-top:8px">+ Добавить цель</button></div>`;
    const dm = debts();
    if (Object.keys(dm).length) {
      h += `<div class="card"><h2>Общие расходы</h2>` + Object.entries(dm).map(([n, v]) => `<div class="listrow"><div class="grow"><b>${esc(n)}</b></div><div class="num ${v > 0 ? 'in' : 'out'}"><b>${Math.abs(v) < 0.5 ? 'всё поровну' : v > 0 ? 'должен(на) тебе ' + money(v, 0) : 'ты должна ' + money(-v, 0)}</b></div></div>`).join('') + `<button class="chip" data-act="settle" style="margin-top:8px">Отметить возврат</button></div>`;
    }
    return h;
  }

  /* ---------- sheets ---------- */
  function sheet(title, body, onSave, opts) {
    opts = opts || {};
    const layer = $('#layer');
    layer.innerHTML = `<div class="overlay" data-close><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="row"><h3>${esc(title)}</h3><button class="iconbtn" type="button" data-close aria-label="Закрыть">✕</button></div><form id="sf">${body}${onSave ? `<div class="btns"><button class="btn primary" type="submit">${esc(opts.save || 'Сохранить')}</button></div>` : ''}${opts.extra || ''}</form></div></div>`;
    const form = $('#sf');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!onSave) return;
      const r = await onSave(form);
      if (r !== false) closeSheet();
    });
    const first = form.querySelector('[autofocus]'); if (first) setTimeout(() => first.focus(), 50);
    return form;
  }
  const closeSheet = () => { $('#layer').innerHTML = ''; };
  const field = (label, inner) => `<label class="f">${label}${inner}</label>`;
  const acctOptions = (sel) => S.cfg.accounts.map((a) => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.name)}</option>`).join('');

  function txForm(t, preset) {
    t = t || Object.assign({ type: 'expense', date: today(), acct: S.cfg.accounts[0] && S.cfg.accounts[0].id, amount: '' }, preset || {});
    const editing = !!t.id;
    let type = t.type;
    const body = `
      <div class="seg" id="seg"><button type="button" data-seg="expense">Расход</button><button type="button" data-seg="income">Доход</button><button type="button" data-seg="transfer">Перевод</button></div>
      ${field('Сумма', `<input class="amount num" name="amount" inputmode="decimal" placeholder="0" value="${t.amount || ''}" autofocus required>`)}
      <div class="grid2">${field('Дата', `<input type="date" name="date" value="${t.date}" required>`)}${field('<span id="acctlabel">Счёт</span>', `<select name="acct">${acctOptions(t.acct)}</select>`)}</div>
      <div id="toWrap">${field('На счёт', `<select name="to">${acctOptions(t.to || (S.cfg.accounts[1] && S.cfg.accounts[1].id))}</select>`)}</div>
      <div id="catWrap">${field('Категория', `<input name="cat" list="catlist" value="${esc(t.cat || '')}" placeholder="Например, Продукты"><datalist id="catlist"></datalist>`)}</div>
      ${field('Заметка', `<input name="note" value="${esc(t.note || '')}" placeholder="Где или за что">`)}
      ${field('Теги (необязательно)', `<input name="tags" value="${esc(t.tags || '')}" placeholder="отпуск, подарки">`)}
      <div id="splitWrap">${field('Делили пополам с (необязательно)', `<input name="partner" value="${esc(t.kind === 'settle' ? '' : t.partner || '')}" placeholder="Имя">`)}</div>
      ${editing ? `<button type="button" class="btn danger" id="delbtn">Удалить операцию</button>` : ''}`;
    const form = sheet(editing ? 'Операция' : 'Новая операция', body, (f) => {
      const amount = Math.abs(num(f.amount.value));
      if (!(amount > 0)) { toast('Введи сумму'); return false; }
      const o = Object.assign({}, t, { id: t.id || uid(), type, amount, date: f.date.value, acct: f.acct.value, note: f.note.value.trim(), ts: t.ts || Date.now() });
      if (type === 'transfer') { o.to = f.to.value; o.cat = ''; if (o.to === o.acct) { toast('Выбери разные счета'); return false; } }
      else { o.cat = f.cat.value.trim() || 'Прочее'; delete o.to; }
      o.tags = f.tags.value.trim();
      if (o.kind !== 'settle') {
        if (type === 'expense' && f.partner.value.trim()) { o.partner = f.partner.value.trim(); o.half = true; } else { delete o.partner; delete o.half; }
      }
      saveTx(o);
    });
    const sync = () => {
      form.querySelectorAll('[data-seg]').forEach((b) => b.classList.toggle('on', b.dataset.seg === type));
      $('#splitWrap').hidden = type !== 'expense' || t.kind === 'settle';
      $('#toWrap').hidden = type !== 'transfer'; $('#catWrap').hidden = type === 'transfer';
      $('#acctlabel').textContent = type === 'transfer' ? 'Со счёта' : 'Счёт';
      $('#catlist').innerHTML = (type === 'income' ? INCOME_CATS : allCats()).map((c) => `<option value="${esc(c)}">`).join('');
    };
    sync();
    $('#seg').addEventListener('click', (e) => { const b = e.target.closest('[data-seg]'); if (b) { type = b.dataset.seg; sync(); } });
    const d = $('#delbtn');
    if (d) d.addEventListener('click', () => {
      if (d.dataset.sure) {
        delTx(t.id); closeSheet(); toast('Удалено');
      } else { d.dataset.sure = '1'; d.textContent = 'Нажми ещё раз, чтобы удалить'; }
    });
  }

      <div class="small muted">Расчёт: проценты за ${monthName(r.from)} – ${monthName(r.to)} ${money(r.interest)}, лимит ${money(S.cfg.tax.cap || 750000)}.</div>`, (f) => {

  function taxSetup() {
    const t = S.cfg.tax;
    sheet('Правила возврата', `
      ${field('Максимум возврата за раз', `<input name="cap" inputmode="decimal" value="${t.cap || 750000}" required autofocus>`)}
      ${field('Номера месяцев, когда приходят деньги', `<input name="months" value="${(t.months || []).join(', ')}" placeholder="1, 4, 7, 10">`)}
      <div class="small muted">Июль = 7, октябрь = 10, январь = 1. Ты назвала ещё март (3). Я поставила апрель (4), потому что тогда выходит ровно раз в 3 месяца. Если деньги приходят именно в марте, поменяй 4 на 3. Каждый платёж по процентам учитывается один раз, в ближайший возврат после него.</div>`, (f) => {
      const months = [...new Set(f.months.value.split(/[,\s]+/).map(Number).filter((n) => n >= 1 && n <= 12))].sort((a, b) => a - b);
      if (!months.length) { toast('Укажи хотя бы один месяц'); return false; }
      S.cfg.tax = { cap: num(f.cap.value) || 750000, months };
      saveCfg();
    });
  }

  function settings() {
    sheet('Настройки', `
      ${field('Валюта (символ)', `<input name="cur" value="${esc(S.cfg.cur)}" maxlength="4">`)}
      ${field('Сколько можно тратить в месяц (всего)', `<input name="mb" inputmode="decimal" value="${S.cfg.budget || ''}" placeholder="0">`)}
      ${field('Тема', `<select name="theme"><option value="auto" ${getTheme() === 'auto' ? 'selected' : ''}>Как в телефоне</option><option value="light" ${getTheme() === 'light' ? 'selected' : ''}>Светлая</option><option value="dark" ${getTheme() === 'dark' ? 'selected' : ''}>Тёмная</option></select>`)}
      <div class="btns"><button type="button" class="btn" data-act="budgets">Лимиты по категориям</button><button type="button" class="btn" data-act="recurring">Регулярные платежи</button></div>
      <button type="button" class="btn block" data-act="import">Импорт из банка (CSV)</button>
      <div class="btns"><button type="button" class="btn" data-act="backup">Сохранить копию данных</button><button type="button" class="btn" data-act="restore">Загрузить копию</button></div>
      <div class="btns"><button type="button" class="btn" data-act="pin">PIN-код</button><button type="button" class="btn" data-act="ics">Даты в календарь</button></div>
      <div class="small muted">${S.db ? 'Данные сохраняются в облаке страницы и видны Claude, поэтому можно просто прислать выписку в чат.' : 'Данные хранятся только на этом телефоне.'}</div>`, (f) => { S.cfg.cur = f.cur.value.trim() || '֏'; S.cfg.budget = num(f.mb.value); setTheme(f.theme.value); saveCfg(); });
  }

  function budgets() {
    const cats = allCats();
    sheet('Лимиты на месяц', `<div class="small muted">Оставь пустым, если лимит не нужен.</div>` + cats.map((c, i) => field(esc(c), `<input name="b${i}" inputmode="decimal" value="${S.cfg.budgets[c] || ''}">`)).join(''), (f) => {
      const b = {}; cats.forEach((c, i) => { const v = num(f['b' + i].value); if (v > 0) b[c] = v; });
      S.cfg.budgets = b; saveCfg();
    });
  }

  function recurring() {
    const list = S.cfg.recurring || [];
    sheet('Регулярные платежи', `
      ${list.length ? list.map((r) => `<div class="listrow"><div class="grow"><b>${esc(r.name)}</b><div class="small muted">${money(r.amount)} · каждое ${r.day} число</div></div><button type="button" class="chip" data-act="delrec" data-id="${r.id}">Удалить</button></div>`).join('') : '<div class="small muted">Например: интернет, телефон, подписки, страховка.</div>'}
      <h3 style="font-size:15px;margin-top:6px">Добавить</h3>
      ${field('Название', `<input name="name" required>`)}
      <div class="grid2">${field('Сумма', `<input name="amount" inputmode="decimal" required>`)}${field('День месяца', `<input name="day" inputmode="numeric" value="1">`)}</div>
      <div class="grid2">${field('Категория', `<input name="cat" list="cl2" value="Подписки"><datalist id="cl2">${allCats().map((c) => `<option value="${esc(c)}">`).join('')}</datalist>`)}${field('Счёт', `<select name="acct">${acctOptions()}</select>`)}</div>`, (f) => {
      const amount = num(f.amount.value);
      if (!f.name.value.trim() || !(amount > 0)) { toast('Нужны название и сумма'); return false; }
      S.cfg.recurring = list.concat([{ id: 'r' + Date.now().toString(36), name: f.name.value.trim(), amount, day: Math.min(31, Math.max(1, Math.round(num(f.day.value)) || 1)), cat: f.cat.value.trim() || 'Подписки', acct: f.acct.value }]);
      saveCfg();
    }, { save: 'Добавить' });
  }

  /* ---------- CSV import ---------- */
  function parseCSV(text) {
    const first = text.split(/\r?\n/, 1)[0] || '';
    const delim = [';', '\t', ','].map((d) => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], cell = '', inq = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inq) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inq = false; } else cell += c; }
      else if (c === '"') inq = true;
      else if (c === delim) { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some((x) => x.trim())) rows.push(row); row = []; }
      else cell += c;
    }
    row.push(cell); if (row.some((x) => x.trim())) rows.push(row);
    return rows;
  }
  function parseAmount(s) {
    if (s == null) return null;
    let x = String(s).trim(); if (!x) return null;
    let neg = /^\(.*\)$/.test(x) || /^-|−|–/.test(x) || /-$/.test(x);
    x = x.replace(/[^\d.,]/g, '');
    if (/,\d{1,2}$/.test(x) && !/\.\d/.test(x)) x = x.replace(/\./g, '').replace(',', '.'); else x = x.replace(/,/g, '');
    const n = parseFloat(x); if (!isFinite(n)) return null;
    return neg ? -n : n;
  }
  function parseDate(s, order) {
    s = String(s || '').trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
    m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/);
    if (m) {
      let a = Number(m[1]), b = Number(m[2]), y = Number(m[3]); if (y < 100) y += 2000;
      let d = order === 'mdy' ? b : a, mo = order === 'mdy' ? a : b;
      if (mo > 12 && d <= 12) { const t = d; d = mo; mo = t; }
      if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
      return y + '-' + pad(mo) + '-' + pad(d);
    }
    return null;
  }
  function importRows(text, opts) {
    const rows = parseCSV(text); if (rows.length < 2) return { items: [], err: 'Не нашла строк с данными' };
    const head = rows[0].map((h) => h.trim().toLowerCase());
    const find = (re) => head.findIndex((h) => re.test(h));
    let iD = find(/date|дата|posted|time/), iA = find(/^amount|сумма|amt|sum/), iDeb = find(/debit|списан|расход|withdraw/), iCr = find(/credit|зачисл|приход|deposit/);
    let iN = find(/desc|memo|payee|name|описан|назначен|merchant|details|получатель|контрагент/);
    if (iD < 0) return { items: [], err: 'Не нашла колонку с датой. В первой строке должны быть названия колонок.' };
    const items = [];
    rows.slice(1).forEach((r) => {
      const date = parseDate(r[iD], opts.order); if (!date) return;
      let amt = null;
      if (iA >= 0) amt = parseAmount(r[iA]);
      if (amt == null && (iDeb >= 0 || iCr >= 0)) { const d = iDeb >= 0 ? parseAmount(r[iDeb]) : null, c = iCr >= 0 ? parseAmount(r[iCr]) : null; if (d) amt = -Math.abs(d); else if (c) amt = Math.abs(c); }
      if (amt == null || amt === 0) return;
      if (opts.invert) amt = -amt;
      items.push({ date, type: amt < 0 ? 'expense' : 'income', amount: Math.abs(amt), note: (iN >= 0 ? r[iN] : r.filter((_, i) => i !== iD && i !== iA).join(' ')).trim().slice(0, 120) });
    });
    return { items, err: items.length ? '' : 'Не получилось прочитать суммы. Проверь колонки.' };
  }
  const keyOf = (t) => [t.date, t.type, Math.round(t.amount * 100), (t.note || '').toLowerCase()].join('|');

  function importSheet() {
    let items = [];
    const form = sheet('Импорт из банка', `
      ${field('Файл CSV', `<input type="file" id="csvfile" accept=".csv,.txt,text/csv,text/plain" style="height:auto;padding:10px">`)}
      ${field('Или вставь текст выписки', `<textarea name="text" placeholder="Date,Description,Amount&#10;2026-10-01,Trader Joe's,-54.20"></textarea>`)}
      <div class="grid2">${field('Формат даты', `<select name="order"><option value="mdy">месяц/день/год</option><option value="dmy">день.месяц.год</option></select>`)}${field('На какой счёт', `<select name="acct">${acctOptions()}</select>`)}</div>
      <label class="row small"><input type="checkbox" name="invert"> В моём банке расходы идут со знаком плюс</label>
      <div id="prev" class="small muted">Выбери файл или вставь текст, и я покажу, что нашлось.</div>`, async (f) => {
      if (!items.length) { toast('Сначала загрузи данные'); return false; }
      const have = new Set(S.tx.map(keyOf));
      const fresh = items.filter((t) => !have.has(keyOf(t)));
      if (!fresh.length) { toast('Всё это уже есть'); return false; }
      const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Сохраняю…';
      for (let i = 0; i < fresh.length; i += 5) {
        await Promise.all(fresh.slice(i, i + 5).map((t) => { const o = Object.assign({ id: uid(), cat: t.type === 'income' ? 'Доход' : 'Без категории', acct: f.acct.value, ts: Date.now() }, t); return saveTx(o); }));
      }
      toast('Добавлено операций: ' + fresh.length);
    }, { save: 'Импортировать' });
    const run = () => {
      const text = form.text.value; if (!text.trim()) return;
      const r = importRows(text, { order: form.order.value, invert: form.invert.checked });
      items = r.items;
      const have = new Set(S.tx.map(keyOf));
      const dup = items.filter((t) => have.has(keyOf(t))).length;
      $('#prev').innerHTML = r.err ? `<span class="out">${esc(r.err)}</span>` : `Нашла <b>${items.length}</b> операций (${items.filter((t) => t.type === 'expense').length} расходов), дубликатов: ${dup}. Примеры:<br>` + items.slice(0, 3).map((t) => `${t.date} · ${esc(t.note)} · ${t.type === 'expense' ? '−' : '+'}${t.amount}`).join('<br>');
    };
    form.text.addEventListener('input', run); form.order.addEventListener('change', run); form.invert.addEventListener('change', run);
    $('#csvfile').addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      const rd = new FileReader(); rd.onload = () => { form.text.value = String(rd.result); run(); }; rd.readAsText(file);
    });
  }

  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }
  function calendarFile() {
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Finance//RU//', 'CALSCALE:GREGORIAN'];
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const ev = (uidv, date, title) => L.push('BEGIN:VEVENT', 'UID:' + uidv + '@finance', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + date.replace(/-/g, ''), 'SUMMARY:' + title,
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + title, 'TRIGGER:-P2DT15H', 'END:VALARM', 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + title, 'TRIGGER:-PT15H', 'END:VALARM', 'END:VEVENT');
    const pm = paidMap(), rm = recvMap(); let n = 0;
    PAY.forEach((p, i) => { if (!pm[i] && p[0] >= today()) { ev('m' + i, p[0], 'Ипотека ' + Math.round(p[3]) + ' ' + cur()); n++; } });
    taxRefunds().forEach((r) => { if (!rm[r.key] && r.date >= today()) { ev('t' + r.key, r.date, 'Возврат налога около ' + Math.round(r.amount) + ' ' + cur()); n++; } });
    L.push('END:VCALENDAR');
    try { download('finance-calendar.ics', L.join('\r\n'), 'text/calendar'); toast('Файл календаря: событий ' + n); } catch (e) { toast('Не получилось создать файл'); }
  }

  /* PIN lock (a screen guard on this device, not encryption) */
  const getPin = () => { try { return localStorage.getItem('fin_pin') || ''; } catch (e) { return ''; } };
  async function hashPin(p) {
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fin:' + p)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join(''); }
    catch (e) { return 'x' + p.split('').reverse().join(''); }
  }
  let lockBuf = '';
  function drawLock(msg) {
    const el = $('#lock'); if (!el) return;
    el.innerHTML = `<div class="mid">Введи PIN</div><div class="dots">${[0, 1, 2, 3].map((i) => `<i class="${i < lockBuf.length ? 'on' : ''}"></i>`).join('')}</div><div class="small out" style="min-height:18px">${msg || ''}</div><div class="keys">${'123456789'.split('').map((k) => `<button type="button" data-key="${k}">${k}</button>`).join('')}<span></span><button type="button" data-key="0">0</button><button type="button" data-key="del">⌫</button></div>`;
  }
  function showLock() {
    if (!getPin()) return;
    lockBuf = '';
    if (!$('#lock')) { const el = document.createElement('div'); el.id = 'lock'; el.className = 'lockscreen'; document.body.appendChild(el); }
    drawLock();
  }
  async function lockKey(k) {
    if (k === 'del') lockBuf = lockBuf.slice(0, -1); else if (lockBuf.length < 4) lockBuf += k;
    drawLock();
    if (lockBuf.length === 4) {
      if ((await hashPin(lockBuf)) === getPin()) { $('#lock').remove(); lockBuf = ''; }
      else { lockBuf = ''; drawLock('Неверный PIN'); }
    }
  }
  function pinSheet() {
    const has = !!getPin();
    sheet('PIN-код', `${field(has ? 'Новый PIN (4 цифры)' : 'PIN (4 цифры)', `<input name="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autofocus>`)}
      <div class="small muted">Закрывает приложение на этом устройстве, когда ты вернёшься в него через минуту и позже. Это защита от посторонних взглядов, а не шифрование.</div>
      ${has ? '<button type="button" class="btn danger" id="rmpin">Убрать PIN</button>' : ''}`, async (f) => {
      if (!/^\d{4}$/.test(f.pin.value)) { toast('Нужны 4 цифры'); return false; }
      try { localStorage.setItem('fin_pin', await hashPin(f.pin.value)); toast('PIN установлен'); } catch (e) { toast('Не получилось сохранить PIN'); }
    });
    const r = $('#rmpin'); if (r) r.addEventListener('click', () => { try { localStorage.removeItem('fin_pin'); } catch (e) {} closeSheet(); toast('PIN убран'); });
  }

  function backup() {
    const data = JSON.stringify({ app: 'finance', v: 1, tx: S.tx, cfg: S.cfg });
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      a.download = 'finance-backup-' + today() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      try { localStorage.setItem('fin_lb', today()); } catch (e) {}
      toast('Копия сохранена в загрузки'); render();
    } catch (e) { toast('Не получилось сохранить файл'); }
  }
  function restore() {
    sheet('Загрузить копию', `${field('Файл finance-backup.json', `<input type="file" id="bk" accept=".json,application/json" style="height:auto;padding:10px">`)}<div class="small muted">Операции добавятся к текущим, настройки заменятся.</div>`);
    $('#bk').addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const d = JSON.parse(String(rd.result));
          if (!d || !Array.isArray(d.tx)) throw new Error('bad');
          if (d.cfg) { S.cfg = Object.assign(defaultCfg(), d.cfg); saveCfg(); }
          d.tx.forEach((t) => { if (t && t.id) saveTx(t); });
          closeSheet(); toast('Загружено операций: ' + d.tx.length);
        } catch (err) { toast('Это не файл копии'); }
      };
      rd.readAsText(file);
    });
  }

  /* ---------- events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('.sheet') === null && t.closest('.overlay') && t.classList.contains('overlay')) { closeSheet(); return; }
    if (t.closest('[data-close]') && t.closest('.iconbtn')) { closeSheet(); return; }
    const tab = t.closest('[data-tab]'); if (tab) { S.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
    const fl = t.closest('[data-filter]'); if (fl) { S.filter = fl.dataset.filter; render(); return; }
    const ed = t.closest('[data-edit]'); if (ed) { const x = S.tx.find((y) => y.id === ed.dataset.edit); if (x) txForm(x); return; }
    const sd = t.closest('[data-sid]'); if (sd) { const i = Number(sd.dataset.sid); const x = paidMap()[i]; if (x) txForm(x); else payRow(i); return; }
    const rk = t.closest('[data-rkey]'); if (rk) { const x = recvMap()[rk.dataset.rkey]; if (x) txForm(x); else { const r = taxRefunds().find((y) => y.key === rk.dataset.rkey); if (r) recvRow(r); } return; }
    const ms = t.closest('[data-mstat]'); if (ms) { S.mstat = ms.dataset.mstat; render(); return; }
    const ct = t.closest('[data-cat]'); if (ct) { catSheet(ct.dataset.cat); return; }
    const kk = t.closest('[data-key]'); if (kk) { lockKey(kk.dataset.key); return; }
    const tg = t.closest('[data-tag]'); if (tg) { tagSheet(tg.dataset.tag); return; }
    const pl = t.closest('[data-plan]'); if (pl) { planForm((S.cfg.plans || []).find((x) => x.id === pl.dataset.plan)); return; }
    const rp = t.closest('[data-rep]'); if (rp) { reportSheet(rp.dataset.rep); return; }
    const ac = t.closest('[data-acc]'); if (ac) { accForm(S.cfg.accounts.find((a) => a.id === ac.dataset.acc)); return; }
    const a = t.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'addtx') txForm();
    else if (act === 'mprev') { S.month = addPeriod(S.month, -1); render(); }
    else if (act === 'mnext') { S.month = addPeriod(S.month, 1); render(); }
    else if (act === 'settings') settings();
    else if (act === 'markpast') markPast();
    else if (act === 'taxsetup') taxSetup();
    else if (act === 'addacc') accForm();
    else if (act === 'transfer') txForm(null, { type: 'transfer' });
    else if (act === 'budgets') budgets();
    else if (act === 'recurring') recurring();
    else if (act === 'import') importSheet();
    else if (act === 'backup') backup();
    else if (act === 'pin') pinSheet();
    else if (act === 'report') reportSheet('month');
    else if (act === 'addplan') planForm();
    else if (act === 'settle') settleSheet();
    else if (act === 'copyrep') { try { navigator.clipboard.writeText(lastReport).then(() => toast('Скопировано'), () => toast('Не получилось скопировать')); } catch (e) { toast('Не получилось скопировать'); } }
    else if (act === 'ics') calendarFile();
    else if (act === 'restore') restore();
    else if (act === 'delrec') { S.cfg.recurring = S.cfg.recurring.filter((r) => r.id !== a.dataset.id); saveCfg(); recurring(); }
    else if (act === 'payrec') {
      const x = recurringDue().find((y) => y.r.id === a.dataset.id); if (!x) return;
      saveTx({ id: uid(), type: 'expense', rid: x.r.id, period: x.nextPeriod, cat: x.r.cat, note: x.r.name, amount: x.r.amount, date: today(), acct: x.r.acct, ts: Date.now() });
      toast('Записано: ' + x.r.name);
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'myear') { S.myear = e.target.value; render(); }
    if (e.target.id === 'tyear') { S.tyear = e.target.value; render(); }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'xm' || e.target.id === 'xl') { S.extra[e.target.id === 'xm' ? 'monthly' : 'lump'] = num(e.target.value); const r = $('#xres'); if (r) r.innerHTML = extraResult(); return; }
    if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const el = $('#q'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
  });

  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (getPin() && hiddenAt && Date.now() - hiddenAt > 60000) showLock();
  });
  applyTheme();
  showLock();
  boot();
})();
</script>

</body>
